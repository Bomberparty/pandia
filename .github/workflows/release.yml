name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_targets: 'x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
          - platform: windows-latest
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.platform }}

    env:
      VITE_BLOCK_CONTEXT_MENU: 'true'
      VITE_ENABLE_SANDBOX: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Linux dependencies ──────────────────────────────────────────────
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      # ── Node.js ─────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # ── Rust ────────────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── Install frontend dependencies ───────────────────────────────────
      - name: Install root dependencies
        run: npm ci

      - name: Install website dependencies
        run: npm ci
        working-directory: ./website

      # ── Build and upload release (UNSIGNED, NO UPDATER) ─────────────────
      - name: Build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Pandia ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: 'Automated unsigned test build.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}' --config src-tauri/tauri.prod.conf.json

      # ── AppImage .DirIcon (Linux Only, UNSIGNED) ────────────────────────
      - name: AppImage .DirIcon
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"

          APPIMAGE=$(find src-tauri/target/release/bundle/appimage \
            -maxdepth 1 -name '*.AppImage' ! -name '*.tar.gz*' | head -1)
          [ -z "$APPIMAGE" ] && { echo "No AppImage found"; exit 0; }

          NAME=$(basename "$APPIMAGE")
          DIR=$(dirname "$APPIMAGE")

          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          rm -f squashfs-root/.DirIcon
          cp src-tauri/icons/128x128@2x.png squashfs-root/.DirIcon

          chmod -R u=rwX,go=rX squashfs-root

          curl -fsSL -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool

          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run \
            squashfs-root "$APPIMAGE"

          tar -czf "${APPIMAGE}.tar.gz" -C "$DIR" "$NAME"

          for S in "" ".tar.gz"; do
            gh release delete-asset "$TAG" "${NAME}${S}" --yes 2>/dev/null || true
          done
          gh release upload "$TAG" \
            "$APPIMAGE" "${APPIMAGE}.tar.gz"

          rm -rf squashfs-root /tmp/appimagetool
